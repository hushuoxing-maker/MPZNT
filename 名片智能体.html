<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>黑金御所 | 智能动态20组名片方案（严格遵循输入配置）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0806;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            color: #e9e3d5;
            padding: 2rem;
        }
        :root {
            --gold: #d4af37;
            --gold-light: #f3e3a2;
            --gold-dark: #a67c00;
            --panel-bg: #1b1815;
            --border-gold: rgba(212, 175, 55, 0.4);
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .dashboard { display: flex; flex-wrap: wrap; gap: 2rem; margin-bottom: 2rem; }
        .config-panel {
            flex: 1.2; min-width: 380px; background: var(--panel-bg);
            border-radius: 2rem; border: 1px solid var(--border-gold);
            padding: 1.8rem 1.5rem; max-height: 85vh; overflow-y: auto;
        }
        .preview-panel {
            flex: 1; min-width: 400px; background: linear-gradient(145deg, #151210, #0f0d0b);
            border-radius: 2rem; border: 1px solid var(--border-gold);
            padding: 1.8rem; display: flex; flex-direction: column; gap: 2rem;
        }
        .cards-showcase {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 1.8rem;
            background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 1.5rem;
        }
        .card-face {
            width: 290px; height: 180px; background: white; border-radius: 14px;
            box-shadow: 0 20px 30px -12px black, 0 0 0 1px rgba(212,175,55,0.3);
            padding: 14px 16px; transition: all 0.2s;
        }
        .card-face.vertical { width: 150px; height: 230px; }
        .card-label {
            font-size: 9px; text-transform: uppercase; background: rgba(0,0,0,0.5);
            display: inline-block; padding: 2px 8px; border-radius: 20px;
            color: var(--gold-light); margin-bottom: 8px;
        }
        .logo-img { width: 38px; height: 38px; object-fit: contain; background: #f5f0e0; border-radius: 8px; padding: 4px; }
        .company-name { font-weight: 800; font-size: 14px; }
        .name-text { font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
        .en-name { font-size: 9px; opacity: 0.7; }
        .position { font-size: 10px; font-weight: 600; margin-top: 4px; }
        .slogan { font-size: 8px; margin-top: 6px; font-style: italic; }
        .contact-info { font-size: 7px; margin-top: 8px; line-height: 1.3; }
        .qr-mock { width: 44px; height: 44px; background: repeating-linear-gradient(45deg, #000, #000 4px, #333 4px, #333 8px); border-radius: 8px; margin-top: 5px; }
        .section-title {
            font-size: 0.85rem; font-weight: 600; color: var(--gold);
            border-left: 3px solid var(--gold); padding-left: 10px;
            margin: 1.2rem 0 0.8rem 0;
        }
        .button-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .option-btn {
            background: #2a2723; border: 1px solid #44403c; color: #ddd;
            padding: 6px 14px; border-radius: 40px; font-size: 0.7rem; cursor: pointer;
        }
        .option-btn.active { background: var(--gold-dark); border-color: var(--gold); color: #0a0806; font-weight: bold; }
        .input-field, textarea {
            background: #282521; border: 1px solid #4a453e; border-radius: 14px;
            padding: 8px 14px; width: 100%; margin-bottom: 12px; color: #f0ead8;
        }
        .row-2col { display: flex; gap: 12px; }
        .row-2col > div { flex: 1; }
        .upload-box { border: 1px dashed var(--gold); border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 12px; background: #1f1b17; }
        .preview-tips { background: #1c1915; border-radius: 1rem; padding: 1rem; border-top: 1px solid var(--gold); }
        .generate-prompt { color: var(--gold-light); background: #0f0e0c; padding: 8px; border-radius: 12px; font-size: 0.65rem; word-break: break-all; }
        .copy-btn {
            background: rgba(212,175,55,0.2); border: 1px solid var(--gold); color: var(--gold);
            border-radius: 30px; padding: 2px 10px; font-size: 0.6rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .copy-btn:hover { background: var(--gold); color: #0a0806; }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #b58e2e);
            border: none; color: #0a0806; font-weight: bold; padding: 12px 24px;
            border-radius: 40px; font-size: 1rem; cursor: pointer; width: 100%;
        }
        .full-gallery { margin-top: 3rem; background: #0f0d0b; border-radius: 2rem; border: 1px solid var(--border-gold); padding: 2rem 1.5rem; }
        .grid-20 { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.8rem; margin-top: 1.5rem; }
        .design-card { background: #1b1815; border-radius: 1.5rem; overflow: hidden; border: 1px solid rgba(212,175,55,0.3); }
        .mini-mockup { background: #28241f; padding: 1rem; display: flex; gap: 0.8rem; justify-content: center; border-bottom: 1px solid #3a342c; }
        .mini-card { width: 140px; height: 88px; background: white; border-radius: 8px; padding: 6px; font-size: 6px; display: flex; flex-direction: column; justify-content: center; }
        .design-concept { font-size: 0.75rem; font-weight: 600; padding: 0.6rem 1rem; background: #25211c; color: var(--gold-light); }
        .prompt-text { font-size: 0.6rem; padding: 0.6rem; background: #12100c; font-family: monospace; color: #e2dccd; display: flex; justify-content: space-between; gap: 8px; }
        .craft-tag { padding: 0.4rem 0.8rem; font-size: 0.6rem; background: #1f1d19; color: #bba77a; }
        .toast-msg { position: fixed; bottom: 20px; right: 20px; background: #1f1b17; border-left: 4px solid var(--gold); padding: 8px 16px; border-radius: 40px; color: var(--gold-light); z-index: 1000; animation: fadeOut 2.5s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        @media (max-width: 980px) { body { padding: 1rem; } }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <h1><i class="fas fa-crown" style="color: var(--gold);"></i> 黑金·名片御制所</h1>
        <div><i class="fas fa-gem" style="color: var(--gold);"></i> 动态生成 · 严格遵循您的每一处设定</div>
    </div>
    <div class="dashboard">
        <!-- 左侧配置区 -->
        <div class="config-panel">
            <div class="section-title"><i class="fas fa-id-card"></i> 核心信息</div>
            <div class="row-2col">
                <input type="text" id="companyName" class="input-field" placeholder="公司名称" value="黑金万象设计">
                <input type="text" id="brandName" class="input-field" placeholder="品牌名称" value="BLACKEN·GILD">
            </div>
            <div class="row-2col">
                <input type="text" id="fullname" class="input-field" placeholder="姓名" value="陈砚秋">
                <input type="text" id="engName" class="input-field" placeholder="英文名" value="Yanqiu Chen">
            </div>
            <div class="row-2col">
                <input type="text" id="position" class="input-field" placeholder="职位" value="创意总监">
                <input type="text" id="slogan" class="input-field" placeholder="Slogan" value="极简即奢华">
            </div>
            <input type="text" id="subtitle" class="input-field" placeholder="副标题" value="当代东方美学研习者">
            <textarea id="serviceDesc" rows="2" class="input-field" placeholder="服务介绍">品牌咨询 · 高端视觉 · 御用工艺</textarea>
            <div class="row-2col">
                <input type="text" id="phone" class="input-field" placeholder="电话" value="+86 139 8888 2365">
                <input type="text" id="email" class="input-field" placeholder="邮箱" value="yc@blackengold.com">
            </div>
            <div class="row-2col">
                <input type="text" id="wechat" class="input-field" placeholder="微信" value="blackengold">
                <input type="text" id="website" class="input-field" placeholder="网站" value="www.blacken.com">
            </div>
            <input type="text" id="address" class="input-field" placeholder="地址" value="上海市外滩金融中心">
            <div class="row-2col">
                <input type="text" id="socialMedia" class="input-field" placeholder="社交媒体" value="IG: blackengold">
                <input type="text" id="businessHours" class="input-field" placeholder="营业时间" value="10:00-19:00">
            </div>
            <div class="upload-box">
                <label><i class="fas fa-upload"></i> Logo 图框</label>
                <input type="file" id="logoUpload" accept="image/*">
                <div id="logoPreview" style="margin-top: 8px;"></div>
            </div>
            <div class="section-title"><i class="fas fa-chart-line"></i> 行业属性（多选）</div>
            <div class="button-group" id="industryGroup"></div>
            <div class="section-title"><i class="fas fa-users"></i> 目标人群（多选）</div>
            <div class="button-group" id="targetGroup"></div>
            <div class="section-title"><i class="fas fa-palette"></i> 品牌气质（多选）</div>
            <div class="button-group" id="tasteGroup"></div>
            <div class="section-title"><i class="fas fa-star"></i> 名片风格</div>
            <div class="button-group" id="styleGroup"></div>
            <div class="section-title"><i class="fas fa-fill-drip"></i> 颜色系统</div>
            <div class="button-group" id="colorGroup"></div>
            <div class="section-title"><i class="fas fa-file-alt"></i> 材质 & 工艺</div>
            <div class="button-group" id="materialGroup"></div>
            <div class="button-group" id="craftGroup"></div>
            <div class="section-title"><i class="fas fa-vector-square"></i> 布局 & 对齐</div>
            <div class="button-group" id="layoutOrientation"></div>
            <div class="button-group" id="infoAlignGroup"></div>
            <div class="section-title"><i class="fas fa-mobile-alt"></i> 反面功能</div>
            <div class="button-group" id="backFeatureGroup"></div>
        </div>

        <!-- 右侧预览区 -->
        <div class="preview-panel">
            <div class="cards-showcase">
                <div class="card-item"><div class="card-face" id="frontCard"><div class="card-label">正面</div><div id="frontDynamic"></div></div></div>
                <div class="card-item"><div class="card-face" id="backCard"><div class="card-label">反面</div><div id="backDynamic"></div></div></div>
            </div>
            <div class="preview-tips">
                <div><strong><i class="fas fa-gem"></i> 当前设计概念</strong></div>
                <div id="designConceptText" class="generate-prompt">根据您的配置生成</div>
                <div style="position: relative; margin-top: 10px;">
                    <div id="promptPreview" class="generate-prompt" style="padding-right: 70px;">✨ 实时提示词</div>
                    <button id="copyMainPromptBtn" class="copy-btn" style="position: absolute; right: 8px; bottom: 8px;">复制</button>
                </div>
                <div id="craftAdvice" style="margin-top: 6px; font-size:0.7rem;">工艺建议</div>
            </div>
            <button id="generate20Btn" class="btn-gold"><i class="fas fa-layer-group"></i> ✨ 严格按照当前配置生成20组方案 ✨</button>
        </div>
    </div>
    <div id="fullGalleryContainer" class="full-gallery">
        <div style="border-bottom: 1px solid var(--gold); padding-bottom: 0.5rem; margin-bottom: 1rem;">
            <h2><i class="fas fa-crown"></i> 20组动态方案（完全基于您左侧的选择）</h2>
        </div>
        <div id="twentyGrid" class="grid-20"><div style="grid-column:1/-1; text-align:center; padding:3rem;">点击按钮，立即生成20组严格遵循您设定的名片方案</div></div>
    </div>
</div>

<script>
    // ========== 全局变量 ==========
    let selectedIndustry = [], selectedTarget = [], selectedTaste = [];
    let selectedStyle = "商务极简", selectedColor = "商务黑金", selectedMaterial = "触感纸", selectedCraft = "烫金";
    let selectedOrientation = "横版经典", selectedAlign = "左对齐", selectedBackFeature = "二维码引流";
    let windowLogoDataUrl = '';

    // 预定义选项池
    const industries = ["金融","律师","投资","企业服务","咨询","科技","AI","区块链","餐饮","美容","美甲","健身","服装","烟酒","茶馆","汽修","建筑","室内","摄影","艺术家","插画","美陈","珠宝","风水","命理","道家","茶文化","香道","豪宅","私人会所","高定","奢侈品","游艇","红酒","DJ","潮牌","电竞","自媒体","街头文化"];
    const targets = ["企业老板","年轻女性","高净值客户","家庭用户","宝妈","Z世代","政府客户","投资人","外国客户","高端圈层","艺术圈","本地客户","游客客户"];
    const tastes = ["高级","极简","东方","科技","潮流","未来感","国潮","轻奢","暗黑","温暖","女性化","商务正式","艺术感","自然系","机械风","朋克","禅意","新中式","赛博朋克","苹果风","MUJI风","北欧","巴洛克","包豪斯"];
    const styles = ["商务极简","高端轻奢","国潮新中式","科技未来风","潮流视觉风","女性高级风","艺术设计风","IP卡通风","门店引流风","社交裂变风"];
    const colors = ["商务黑金","深蓝银灰","科技电光蓝","紫渐变","深空黑","奶油白","豆沙粉","香槟金","中国红","墨黑玉石绿","哑光黑","古铜金","深咖啡"];
    const materials = ["铜版纸","哑粉纸","特种纸","珠光纸","棉纸","触感纸","牛皮纸","艺术纸","磨砂纸","透明PVC","亚克力","金属名片","木质名片"];
    const crafts = ["烫金","烫银","UV","凹凸压印","浮雕","镂空","激光雕刻","局部UV","边缘镀金","双层拼接","半透明","磁吸结构"];
    const orientations = ["横版经典","竖版雅致","方形当代","超长奢华","异形先锋"];
    const aligns = ["左对齐","居中对齐","极简留白","几何分割","模块化","杂志式"];
    const backFeatures = ["二维码引流","业务介绍","服务范围","地图指引","IP形象","Slogan放大","社交裂变","微信入口","AI助手","小程序入口"];

    // 辅助函数
    function showToast(msg) {
        const toast = document.createElement('div'); toast.className = 'toast-msg'; toast.innerText = msg;
        document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
    }
    async function copyText(text, successMsg = "✅ 已复制") {
        if (!text) return showToast("无内容");
        if (navigator.clipboard && window.isSecureContext) {
            try { await navigator.clipboard.writeText(text); showToast(successMsg); return; } catch(e) { console.warn(e); }
        }
        const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
        showToast(successMsg);
    }

    // 获取表单数据
    function getFormData() {
        return {
            company: document.getElementById('companyName').value || '公司名',
            brand: document.getElementById('brandName').value || '',
            name: document.getElementById('fullname').value || '姓名',
            enName: document.getElementById('engName').value || '',
            position: document.getElementById('position').value || '职位',
            slogan: document.getElementById('slogan').value || '',
            subtitle: document.getElementById('subtitle').value || '',
            service: document.getElementById('serviceDesc').value || '',
            phone: document.getElementById('phone').value || '',
            email: document.getElementById('email').value || '',
            wechat: document.getElementById('wechat').value || '',
            website: document.getElementById('website').value || '',
            address: document.getElementById('address').value || '',
            social: document.getElementById('socialMedia').value || '',
            hours: document.getElementById('businessHours').value || '',
            logoUrl: windowLogoDataUrl
        };
    }

    // 实时预览更新 (简化)
    function updatePreview() {
        const data = getFormData();
        const frontDiv = document.getElementById('frontDynamic');
        const backDiv = document.getElementById('backDynamic');
        const frontCard = document.getElementById('frontCard');
        const backCard = document.getElementById('backCard');
        const isVertical = selectedOrientation.includes('竖版');
        if(isVertical) { frontCard.classList.add('vertical'); backCard.classList.add('vertical'); }
        else { frontCard.classList.remove('vertical'); backCard.classList.remove('vertical'); }
        let bgStyle = "background: #faf7f0; color:#1f1e1a;";
        if(selectedStyle === "高端轻奢" || selectedColor.includes("黑金")) bgStyle = "background: radial-gradient(ellipse at 30% 40%, #1f1b17, #0c0a08); color:#e7dbbc; border:1px solid #d4af37;";
        if(selectedStyle === "国潮新中式") bgStyle = "background: #e9e2cf; color:#4c3b2b;";
        frontCard.style.cssText = bgStyle + '; padding:12px 14px;';
        backCard.style.cssText = bgStyle + '; padding:12px 14px;';
        const logoHtml = windowLogoDataUrl ? `<img src="${windowLogoDataUrl}" class="logo-img">` : '<div class="logo-img" style="background:#c5b888;"><i class="fas fa-crown"></i></div>';
        frontDiv.innerHTML = `<div style="display:flex; gap:8px; margin-bottom:8px;">${logoHtml}<div><div class="company-name">${data.company}</div><div class="en-name">${data.brand}</div></div></div><div><div class="name-text">${data.name}</div><div class="en-name">${data.enName}</div><div class="position">${data.position}</div><div class="slogan">“${data.slogan}”</div><div class="contact-info">📞 ${data.phone}  ✉️ ${data.email}</div></div>`;
        backDiv.innerHTML = `<div><i class="fas fa-star-of-life"></i> ${data.subtitle}</div><div>${data.address}</div><div class="qr-mock"></div><div>${selectedBackFeature}</div>`;
        const concept = `风格:${selectedStyle} | 色调:${selectedColor} | 材质:${selectedMaterial} | 工艺:${selectedCraft} | 布局:${selectedOrientation} | 对齐:${selectedAlign}`;
        document.getElementById('designConceptText').innerHTML = concept;
        const fullPrompt = `名片双面样机，${selectedStyle}风格，${selectedColor}主色，${selectedMaterial}材质，${selectedCraft}工艺，${selectedOrientation}版式，${selectedAlign}排版。正面展示「${data.name}」「${data.position}」「${data.company}」及联系方式${data.phone}。反面设置${selectedBackFeature}引流模块。背景纯色，写实摄影，柔和侧光，高端质感。`;
        document.getElementById('promptPreview').innerHTML = fullPrompt;
        document.getElementById('craftAdvice').innerHTML = `建议工艺：${selectedMaterial} + ${selectedCraft}，文字安全区≥3mm，圆角建议3-5mm。`;
    }

    // 动态生成20组方案 (完全基于当前选择，严禁预设内容)
    function generateDynamic20Groups() {
        const data = getFormData();
        const groups = [];
        // 根据用户选择的风格基调，定义20种微变策略（工艺、装饰、局部细节不同，但都符合用户主风格）
        const variations = [
            { nameAdd: "极简留白版", craftVar: "局部UV", layoutVar: "大量留白" },
            { nameAdd: "微浮雕肌理", craftVar: "凹凸压印", layoutVar: "文字立体感" },
            { nameAdd: "烫金细线框", craftVar: "烫金+边缘镀金", layoutVar: "细线装饰" },
            { nameAdd: "半透明叠层", craftVar: "半透明材质", layoutVar: "双层拼接" },
            { nameAdd: "金属拉丝感", craftVar: "金属名片+激光雕刻", layoutVar: "拉丝纹理" },
            { nameAdd: "磨砂质感", craftVar: "磨砂UV", layoutVar: "触感柔和" },
            { nameAdd: "局部镂空", craftVar: "镂空+浮雕", layoutVar: "透视层次" },
            { nameAdd: "荧光专色", craftVar: "UV+荧光墨", layoutVar: "科技光晕" },
            { nameAdd: "复古做旧", craftVar: "丝印做旧", layoutVar: "斑驳肌理" },
            { nameAdd: "书画印章风", craftVar: "烫哑红印", layoutVar: "中式留白" },
            { nameAdd: "几何分割", craftVar: "烫银+局部UV", layoutVar: "模块化拼贴" },
            { nameAdd: "杂志式排版", craftVar: "四色印刷+UV", layoutVar: "图文混排" },
            { nameAdd: "全息镭射", craftVar: "镭射烫银", layoutVar: "幻彩倾斜" },
            { nameAdd: "木质天然感", craftVar: "木质名片+激光", layoutVar: "自然纤维" },
            { nameAdd: "未来网格", craftVar: "透明PVC+UV", layoutVar: "参数化网格" },
            { nameAdd: "奢华深压纹", craftVar: "深度压印+烫金", layoutVar: "立体徽章" },
            { nameAdd: "手写艺术字", craftVar: "丝印+凸UV", layoutVar: "手绘风格" },
            { nameAdd: "磁吸双层", craftVar: "磁吸结构+烫金", layoutVar: "开合趣味" },
            { nameAdd: "亚克力水晶", craftVar: "亚克力+边缘镀金", layoutVar: "透明叠加" },
            { nameAdd: "极端异形", craftVar: "模切异形+UV", layoutVar: "先锋轮廓" }
        ];
        // 行业、人群、气质文本合并（用于丰富提示词）
        const industryStr = selectedIndustry.length ? selectedIndustry.join("、") : "通用商务";
        const targetStr = selectedTarget.length ? selectedTarget.join("、") : "专业客户";
        const tasteStr = selectedTaste.length ? selectedTaste.join("、") : "高级";
        for (let i = 0; i < 20; i++) {
            const v = variations[i % variations.length];
            // 保持用户选择的风格基调，但微调工艺和布局描述
            const finalCraft = v.craftVar;
            const finalLayoutHint = v.layoutVar;
            const designName = `${selectedStyle}·${v.nameAdd}`;
            const concept = `${selectedStyle}风格，${selectedColor}色调，融入${tasteStr}气质，针对${targetStr}人群，${finalLayoutHint}版式，${finalCraft}工艺。`;
            // 严格基于用户输入构建提示词，不得自行修改核心信息
            let prompt = `名片双面样机，${selectedStyle}设计风格，主色调${selectedColor}，采用${selectedMaterial}基底，叠加${finalCraft}工艺，${selectedOrientation}版式，${selectedAlign}排版。正面信息：${data.company}（${data.brand}），姓名「${data.name}」英文名「${data.enName}」，职位「${data.position}」，标语“${data.slogan}”，联系方式电话${data.phone}邮箱${data.email}微信${data.wechat}。反面区域：${selectedBackFeature}功能入口，结合二维码或社交裂变。行业属性：${industryStr}，目标人群：${targetStr}，品牌调性：${tasteStr}。背景纯色，自然光，写实摄影，双面并排展示。`;
            // 保证提示词完整包含所有用户填写字段
            prompt += ` 额外细节：地址${data.address}，营业时间${data.hours}，网站${data.website}，社交媒体${data.social}，服务介绍“${data.service}”。`;
            const craftAdvice = `推荐${selectedMaterial}（320g+），${finalCraft}，文字距离边缘≥3.5mm，避免裁切。`;
            groups.push({
                id: i+1,
                name: designName,
                concept: concept,
                prompt: prompt,
                craft: craftAdvice,
                frontBg: (selectedColor === "商务黑金" ? "#1a1714" : (selectedColor === "科技电光蓝" ? "#0a1940" : "#f5f0e8")),
                backDesc: `${selectedBackFeature} + 引流二维码`
            });
        }
        return groups;
    }

    // 渲染20组动态方案
    function renderTwentyGroups() {
        const groups = generateDynamic20Groups();
        const container = document.getElementById('twentyGrid');
        if (!container) return;
        container.innerHTML = '';
        groups.forEach(g => {
            const card = document.createElement('div');
            card.className = 'design-card';
            card.innerHTML = `
                <div class="mini-mockup">
                    <div class="mini-card" style="background: ${g.frontBg}; color:#1a1a1a; border:1px solid #d4af37;">
                        <div style="font-weight:bold; font-size:8px;">✨ ${g.name}</div>
                        <div style="font-size:7px;">${getFormData().name}</div>
                        <div style="font-size:6px;">${getFormData().position}</div>
                    </div>
                    <div class="mini-card" style="background:#1c1915; color:#d4af37; border:1px solid #b38f40;">
                        <div style="font-size:7px;">反面：${selectedBackFeature}</div>
                        <div style="font-size:5px;">二维码 + 社交入口</div>
                    </div>
                </div>
                <div class="design-concept">🎴 概念：${g.concept.substring(0, 100)}</div>
                <div class="prompt-text">
                    <span><strong>📝 提示词：</strong>${g.prompt.substring(0, 130)}…</span>
                    <button class="copy-sm" data-full="${g.prompt.replace(/"/g, '&quot;')}">📋 复制</button>
                </div>
                <div class="craft-tag"><i class="fas fa-print"></i> 工艺：${g.craft}</div>
            `;
            const copyBtn = card.querySelector('.copy-sm');
            if (copyBtn) {
                const fullPrompt = g.prompt;
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyText(fullPrompt, `✨ 已复制「${g.name}」提示词`);
                });
            }
            container.appendChild(card);
        });
        document.getElementById('fullGalleryContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 渲染按钮组
    function renderButtonGroup(containerId, items, multi, callbackName) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        items.forEach(item => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.textContent = item;
            let active = false;
            if(!multi) {
                if(callbackName==='style' && selectedStyle===item) active=true;
                if(callbackName==='color' && selectedColor===item) active=true;
                if(callbackName==='material' && selectedMaterial===item) active=true;
                if(callbackName==='craft' && selectedCraft===item) active=true;
                if(callbackName==='orientation' && selectedOrientation===item) active=true;
                if(callbackName==='align' && selectedAlign===item) active=true;
                if(callbackName==='backfeature' && selectedBackFeature===item) active=true;
            } else {
                if(callbackName==='industry' && selectedIndustry.includes(item)) active=true;
                if(callbackName==='target' && selectedTarget.includes(item)) active=true;
                if(callbackName==='taste' && selectedTaste.includes(item)) active=true;
            }
            if(active) btn.classList.add('active');
            btn.addEventListener('click', () => {
                if(multi) {
                    if(callbackName==='industry') selectedIndustry = selectedIndustry.includes(item) ? selectedIndustry.filter(i=>i!==item) : [...selectedIndustry, item];
                    if(callbackName==='target') selectedTarget = selectedTarget.includes(item) ? selectedTarget.filter(t=>t!==item) : [...selectedTarget, item];
                    if(callbackName==='taste') selectedTaste = selectedTaste.includes(item) ? selectedTaste.filter(ta=>ta!==item) : [...selectedTaste, item];
                    renderButtonGroup(containerId, items, true, callbackName);
                } else {
                    if(callbackName==='style') selectedStyle = item;
                    if(callbackName==='color') selectedColor = item;
                    if(callbackName==='material') selectedMaterial = item;
                    if(callbackName==='craft') selectedCraft = item;
                    if(callbackName==='orientation') selectedOrientation = item;
                    if(callbackName==='align') selectedAlign = item;
                    if(callbackName==='backfeature') selectedBackFeature = item;
                    renderButtonGroup(containerId, items, false, callbackName);
                }
                updatePreview();
            });
            container.appendChild(btn);
        });
    }

    // 初始化所有
    function init() {
        renderButtonGroup('industryGroup', industries, true, 'industry');
        renderButtonGroup('targetGroup', targets, true, 'target');
        renderButtonGroup('tasteGroup', tastes, true, 'taste');
        renderButtonGroup('styleGroup', styles, false, 'style');
        renderButtonGroup('colorGroup', colors, false, 'color');
        renderButtonGroup('materialGroup', materials, false, 'material');
        renderButtonGroup('craftGroup', crafts, false, 'craft');
        renderButtonGroup('layoutOrientation', orientations, false, 'orientation');
        renderButtonGroup('infoAlignGroup', aligns, false, 'align');
        renderButtonGroup('backFeatureGroup', backFeatures, false, 'backfeature');
        updatePreview();
        // 监听输入
        const ids = ['companyName','brandName','fullname','engName','position','slogan','subtitle','serviceDesc','phone','email','wechat','website','address','socialMedia','businessHours'];
        ids.forEach(id => { document.getElementById(id)?.addEventListener('input', updatePreview); });
        document.getElementById('logoUpload')?.addEventListener('change', (e) => {
            if(e.target.files[0]) { const reader = new FileReader(); reader.onload = ev => { windowLogoDataUrl = ev.target.result; updatePreview(); }; reader.readAsDataURL(e.target.files[0]); }
            else { windowLogoDataUrl = ''; updatePreview(); }
        });
        document.getElementById('copyMainPromptBtn')?.addEventListener('click', () => {
            const txt = document.getElementById('promptPreview')?.innerText || '';
            copyText(txt, "当前设计提示词已复制");
        });
        document.getElementById('generate20Btn')?.addEventListener('click', () => {
            renderTwentyGroups();
        });
    }
    init();
</script>
</body>
</html>
